<div id="app"></div>
<script id="main">
(function(){
"use strict";
var LIB = JSON.parse(document.getElementById("lib").textContent);
var SRC = { style: document.getElementById("appstyle").textContent, main: document.getElementById("main").textContent, drawings: document.getElementById("drawings").textContent };
var RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
var SC = "scr" + "ipt";

var CATS = {
  hood:{label:"Hood, fenders & mirrors",sec:"front",ex:true},
  bumperF:{label:"Front bumper",sec:"front",ex:true},
  grille:{label:"Grille",sec:"front"},
  lamps:{label:"Headlights",sec:"front"},
  fog:{label:"Fog lights",sec:"front"},
  mirrors:{label:"Mirrors",sec:"front"},
  sides:{label:"Doors & rear fenders",sec:"sides"},
  rockers:{label:"Rocker panels",sec:"sides",ex:true},
  wear:{label:"Door cups, edges & high-wear spots",sec:"sides"},
  bpillars:{label:"B & C pillars",sec:"sides"},
  pillars:{label:"A-pillars & roof edge",sec:"top",ex:true},
  roof:{label:"Roof",sec:"top",ex:true},
  trunk:{label:"Trunk, hatch or tailgate",sec:"rear",ex:true},
  bumperR:{label:"Rear bumper",sec:"rear",ex:true},
  diffuser:{label:"Rear diffuser",sec:"rear"},
  interior:{label:"Screens & interior",sec:"extra",ex:true},
  other:{label:"Other",sec:"extra"}
};
var SECS = [["front","Front end"],["sides","Sides"],["top","Roof & pillars"],["rear","Rear"],["extra","Interior & extras"]];
var BODIES = ["Sedan","Coupe","SUV","Truck","Hatchback","Wagon","Convertible","Van"];

var state = { vid:null, sel:{}, preset:null, canEdit:false, art:null };
var app = document.getElementById("app");

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function money(n){return "$"+Math.round(n).toLocaleString("en-US");}
function vName(v){return [v.year,v.make,v.model,v.trim].filter(Boolean).join(" ");}
function curV(){for(var i=0;i<LIB.vehicles.length;i++){if(LIB.vehicles[i].id===state.vid)return LIB.vehicles[i];}return null;}
function sorted(){return LIB.vehicles.slice().sort(function(a,b){return (b.year+a.make+a.model+a.trim).localeCompare(a.year+b.make+b.model+b.trim);});}
function uniq(a){var o=[];a.forEach(function(x){if(o.indexOf(x)<0)o.push(x);});return o;}

/* ---------- vehicle drawings: four views each, panels traced as shapes ---------- */
var DRAW=JSON.parse(document.getElementById("drawings").textContent);
var DRAW_ORDER=["sedan","fastback","sportcoupe","crossover","fullsuv","boxysuv","regcab","crewcab","convertible","roadster"];
var BODY_DRAW={Sedan:"sedan",Coupe:"fastback",SUV:"crossover",Truck:"crewcab",Hatchback:"sedan",Wagon:"crossover",Convertible:"convertible",Van:"fullsuv"};
var URLS={};
function drawURL(n){
  if(URLS[n]) return URLS[n];
  var b64=DRAW[n].img;
  try{ var b=atob(b64), a=new Uint8Array(b.length); for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i); URLS[n]=URL.createObjectURL(new Blob([a],{type:"image/png"})); }
  catch(e){ URLS[n]="data:image/png;base64,"+b64; }
  return URLS[n];
}
function drawFor(v){ return (v&&v.drawing&&DRAW[v.drawing])?v.drawing:(BODY_DRAW[v&&v.body]||"sedan"); }
function litPaths(dn,on){ var s=""; DRAW[dn].zones.forEach(function(z){ if(on[z[0]]) s+='<path class="bp-on" fill-rule="evenodd"'+(z[2]?' transform="'+z[2]+'"':'')+' d="'+z[1]+'"/>'; }); return s; }
function artTag(dn){ var D=DRAW[dn]; return '<image class="car-art" href="'+drawURL(dn)+'" width="'+D.w+'" height="'+D.h+'"/>'; }
function bpSheet(v,on){
  var dn=drawFor(v), D=DRAW[dn], fs=Math.round(D.w/68), V=D.views, lab="";
  [["top","Top"],["front","Front"],["side","Driver side"],["rear","Rear"]].forEach(function(p){ var r=V[p[0]]; lab+='<text class="bp-label" font-size="'+fs+'" x="'+r[0]+'" y="'+Math.max(D.vb[1]+fs,r[1]-fs*0.6)+'">'+p[1]+'</text>'; });
  return '<svg class="sheet-svg" viewBox="'+D.vb.join(" ")+'" role="img" aria-label="Coverage map: top, driver side, front and rear views with selected panels highlighted">'+artTag(dn)+litPaths(dn,on)+lab+'</svg>';
}
var CROP={hood:["top",0,0,.46,1],bumperF:["front",0,0,1,1],grille:["front",.12,.33,.88,.8],lamps:["front",0,.22,1,.68],fog:["front",0,.48,1,.95],mirrors:["front",0,0,1,1],
  sides:["side",0,0,1,1],rockers:["side",0,0,1,1],wear:["side",.25,.12,.85,.92],pillars:["front",0,0,1,.45],roof:["top",.22,0,.88,1],trunk:["rear",0,0,1,1],bumperR:["rear",0,0,1,1],diffuser:["rear",0,0,1,1],bpillars:["side",.25,0,.85,.75],other:["side",0,0,1,1]};
function cropFor(dn,cat){ var c=CROP[cat]||CROP.other, r=DRAW[dn].views[c[0]], p=4;
  return [Math.round(r[0]+c[1]*r[2]-p),Math.round(r[1]+c[2]*r[3]-p),Math.round((c[3]-c[1])*r[2]+2*p),Math.round((c[4]-c[2])*r[3]+2*p)]; }
function bpThumb(v,crop,on,flip){
  var dn=drawFor(v), inner=artTag(dn)+litPaths(dn,on);
  if(flip) inner='<g transform="translate('+(crop[0]*2+crop[2])+' 0) scale(-1 1)">'+inner+'</g>';
  var cid="tc"+(++bpThumb.n);
  return '<svg class="thumb" viewBox="'+crop.join(' ')+'" aria-hidden="true"><defs><clipPath id="'+cid+'"><rect x="'+crop[0]+'" y="'+crop[1]+'" width="'+crop[2]+'" height="'+crop[3]+'"/></clipPath></defs><g clip-path="url(#'+cid+')">'+inner+'</g></svg>';
}
bpThumb.n=0;

function zonesFor(p){
  var t=(p.name+" "+p.note).toLowerCase(), z=[];
  var side=/\bleft\b/.test(t)?"L":/\bright\b/.test(t)?"R":"";
  function both(b){ if(side) z.push(b+side); else z.push(b+"L",b+"R"); }
  switch(p.cat){
    case "hood":
      var full=/full/.test(t), bik=/bikini/.test(t);
      z.push(full?"hood":bik?"hoodB":"hoodP");
      if(/fender/.test(t)) both(full?"fenders":bik?"fendersB":"fendersP");
      if(/mirror/.test(t)) both("mirrors"); break;
    case "sides": if(/door/.test(t)||!/fender|quarter|bed/.test(t)) both("doors"); if(/fender|quarter|bed/.test(t)) both("quarters"); break;
    case "rockers": both("rockers"); break;
    case "wear": both("wear"); break;
    case "mirrors": both("mirrors"); break;
    case "pillars": both("pillars"); if(/roof/.test(t)) z.push("header"); break;
    case "diffuser": z.push("bumperR"); break;
    case "roof": z.push(/with sunroof|panoramic/.test(t)&&!/without sunroof/.test(t)?"roofS":"roof"); break;
    case "bumperF": case "grille": case "lamps": case "fog": case "trunk": case "bumperR": z.push(p.cat); break;
  }
  return z;
}
function thumbFor(p,v){
  var on={}; zonesFor(p).forEach(function(k){on[k]=1;});
  var t=(p.name+" "+p.note).toLowerCase();
  if(p.cat==="interior"){
    var kit=/interior|console/.test(t), sens=/sensor/.test(t);
    var s='<svg class="thumb" viewBox="0 0 112 64" aria-hidden="true"><path class="bp-body" d="M4 36 C26 22 86 22 108 36 L108 44 L4 44 Z"/>'+
      '<rect class="bp-glass" x="30" y="10" width="52" height="22" rx="2.5"/>'+(sens?'<circle class="bp-dot" cx="56" cy="13" r="1.4"/>':'')+
      '<path class="bp-body" d="M44 44 L68 44 L72 62 L40 62 Z"/><rect class="bp-panel" x="50" y="48" width="12" height="7" rx="2"/><circle class="bp-dot" cx="56" cy="58.5" r="2"/>'+
      '<rect class="bp-on" x="30" y="10" width="52" height="22" rx="2.5"/>'+(kit?'<path class="bp-on" d="M44 44 L68 44 L72 62 L40 62 Z"/>':'')+'</svg>';
    return s;
  }
  var flip=(p.cat==="sides"||p.cat==="rockers"||p.cat==="wear")&&/\bright\b/.test(t);
  if(flip){ on={}; zonesFor({name:p.name.replace(/right/ig,"left"),note:p.note.replace(/right/ig,"left"),cat:p.cat}).forEach(function(k){on[k]=1;}); }
  return bpThumb(v,cropFor(drawFor(v),p.cat),on,flip);
}

/* ---------- presets ---------- */
function byCat(v,c){return v.pieces.filter(function(p){return p.cat===c;});}
/* packages follow the options the customer has already picked (e.g. Z07 bumpers instead of Base) */
function pickHood(v,full,sel){var h=byCat(v,"hood");if(!h.length)return [];var f=h.filter(function(p){return /full/i.test(p.name+p.note);});
  var chosen=h.filter(function(p){return sel&&sel[p.id];})[0];
  if(full){ if(chosen&&f.indexOf(chosen)>=0) return [chosen]; return [(f.length?f:h).slice().sort(function(a,b){return b.price-a.price;})[0]];}
  var pr=h.filter(function(p){return f.indexOf(p)<0;});if(!pr.length)return [];
  if(chosen&&pr.indexOf(chosen)>=0) return [chosen];
  var std=pr.filter(function(p){return !/bikini/i.test(p.name+p.note);});return [(std.length?std:pr)[0]];}
function presetList(v,sel){
  sel=sel||{};
  var sticky=state.pref||{};
  var pref=function(a){var s=a.filter(function(p){return sel[p.id];});if(s.length)return [s[0]];
    var k=a.filter(function(p){return sticky[p.cat]===p.id;});return k.length?[k[0]]:a.slice(0,1);};
  var all=function(c){var a=byCat(v,c);return (CATS[c]||{}).ex?pref(a):a;}, first=function(c){return pref(byCat(v,c));};

  var partial=[].concat(pickHoodS(false),all("bumperF"),all("grille"),all("lamps"),all("mirrors"));
  var front=[].concat(pickHoodS(true),all("bumperF"),all("lamps"),all("grille"),all("fog"),all("mirrors"));
  var track=front.concat(all("rockers"),first("pillars"));
  var car=front.concat(all("sides"),all("rockers"),first("roof"),all("trunk"),all("bumperR"),all("diffuser"),all("wear"));
  if(!(byCat(v,"roof").length&&byCat(v,"sides").length)) car=car.concat(first("pillars"));
  var out=[],seen={};
  [["partial","Partial front",partial],["front","Full front",front],["track","Track pack",track],["full","Full car",car]].forEach(function(p){
    if(p[2].length<2)return; var key=p[2].map(function(x){return x.id;}).sort().join(","); if(seen[key])return; seen[key]=1;
    out.push({id:p[0],label:p[1],ids:p[2].map(function(x){return x.id;}),total:p[2].reduce(function(s,x){return s+x.price;},0)});
  });
  return out;

/* overlap rules: full roof covers the roof edge of an A-pillar kit; full sides cover its pillars */
function covers(list){
  var has=function(c){return list.some(function(p){return p.cat===c;});};
  return {roof:has("roof"), sides:has("sides")};
}
function pillarRedundant(list){ var c=covers(list); return c.roof&&c.sides; }
function coverage(list){
  var c=covers(list), on={};
  list.forEach(function(p){ zonesFor(p).forEach(function(z){
    if(p.cat==="pillars"){ if(z==="header"&&c.roof) return; if(/^pillars/.test(z)&&c.sides) return; }
    on[z]=1; }); });

}
function sideKey(p){ return (p.name+"|"+p.note).toLowerCase().replace(/\b(left|right|driver|passenger)\b/g,"#"); }
function partnerOf(v,p){
  if(!/\b(left|right|driver|passenger)\b/i.test(p.name+" "+p.note)) return null;
  var k=sideKey(p); return v.pieces.filter(function(o){return o.id!==p.id&&o.cat===p.cat&&sideKey(o)===k;})[0]||null;

/* ---------- shop tools (editors only) ---------- */
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function guessCat(name,note){
  var t=(name+" "+note).toLowerCase();
  if(/screen|display|interior|console|piano/.test(t))return "interior";
  if(/hood/.test(t))return "hood";
  /* a separate diffuser kit only: "Diffuser only", or a kit named for the diffuser and not the bumper */
  if(/diffuser only/.test(t)||(/diffuser/i.test(name)&&!/bumper/i.test(name)))return "diffuser";
  if(/bumper/.test(t))return /rear/.test(t)?"bumperR":"bumperF";
  if(/headl|head lamp|headlamp/.test(t))return "lamps";
  if(/fog/.test(t))return "fog";
  if(/grille|grill/.test(t))return "grille";
  if(/b-pillar|c-pillar/.test(t)&&!/a-pillar/.test(t))return "bpillars";
  if(/pillar/.test(t))return "pillars";
  if(/roof/.test(t))return "roof";
  if(/rocker/.test(t))return "rockers";
  if(/wear|cup|handle|edge|sill|step/.test(t))return "wear";
  if(/door|quarter|fender|side/.test(t))return "sides";
  if(/mirror/.test(t))return "mirrors";
  if(/trunk|lift ?gate|tail ?gate|hatch|deck ?lid|luggage|load/.test(t))return "trunk";
  if(/tint/.test(t))return "skip";
  return "other";
}
function parseKits(text,roundTo){
  var clean=text.replace(/Image\s+Part Number\s+Description\s+Difficulty\s+Price/gi," ").replace(/\r/g,"");
  var re=/(?:USD\s*)?\$\s*([\d,]+(?:\.\d{1,2})?)/g, m, last=0, rows=[];
  while((m=re.exec(clean))){
    var chunk=clean.slice(last,m.index); last=re.lastIndex;
    var ref=parseFloat(m[1].replace(/,/g,""));
    var lines=chunk.split(/\n|\t/).map(function(s){return s.trim();}).filter(Boolean);
    lines=lines.filter(function(l){return !/^[A-Z]{0,3}\d{4,}[A-Z]{0,3}$/.test(l) && !/^\d$/.test(l) && !/^USD$/i.test(l);});
    if(!lines.length)continue;
    var name=lines[0].replace(/^[A-Z]{0,3}\d{4,}[A-Z]{0,3}\s+/,"").replace(/\s+\d$/,"").trim();
    var note=lines.slice(1).join(", ").replace(/\s+\d$/,"").replace(/\bW\/\s*/gi,"With ").trim();
    var cat=guessCat(name,note);
    if(!ref||cat==="skip")continue;
    rows.push({name:name,note:note,cat:cat,ref:ref,price:Math.ceil(ref/roundTo)*roundTo});
  }
  return rows;
}

      d.querySelectorAll("[data-link]").forEach(function(b){b.addEventListener("click",function(){
        var url=SHARE_URL+"#"+b.getAttribute("data-link"), v=LIB.vehicles.filter(function(x){return x.id===b.getAttribute("data-link");})[0];
        function show(t){ var m=msg(t); var inp=document.createElement("input"); inp.value=url; inp.readOnly=true; inp.style.marginTop="8px"; m.appendChild(inp); inp.focus(); inp.select(); }
        try{ navigator.clipboard.writeText(url).then(function(){ show("Copied the link for "+vName(v)+". Text it to your customer:"); },function(){ show("Copy this link for "+vName(v)+":"); }); }catch(e){ show("Copy this link for "+vName(v)+":"); }
      });});
      d.querySelectorAll("[data-askdel]").forEach(function(b){b.addEventListener("click",function(){confirmDel=b.getAttribute("data-askdel");draw();});});
      d.querySelectorAll("[data-nodel]").forEach(function(b){b.addEventListener("click",function(){confirmDel=null;draw();});});
      d.querySelectorAll("[data-del]").forEach(function(b){b.addEventListener("click",function(){var id=b.getAttribute("data-del");
        var nl=JSON.parse(JSON.stringify(LIB));nl.vehicles=nl.vehicles.filter(function(x){return x.id!==id;});publishLib(nl,msg(""));});});
      q("#saveS").addEventListener("click",function(){var nl=JSON.parse(JSON.stringify(LIB));nl.shop.phone=q("#sPhone").value.trim();var r=parseInt(q("#sRound").value,10);nl.shop.roundTo=r>0?r:50;publishLib(nl,msg(""));});
    } else {
      ["eY","eM","eO","eT","eB"].forEach(function(id,i){q("#"+id).addEventListener("input",function(e){edit[["year","make","model","trim","body"][i]]=e.target.value;});});
      q("#eB").addEventListener("change",function(){ if(!edit.drawingSet){ edit.drawing=BODY_DRAW[edit.body]||"sedan"; draw(); } });
      q("#eD").addEventListener("change",function(e){edit.drawing=e.target.value;edit.drawingSet=true;draw();});
      d.querySelectorAll("[data-r]").forEach(function(el){el.addEventListener(el.tagName==="SELECT"?"change":"input",function(){var r=edit.rows[+el.getAttribute("data-r")],k=el.getAttribute("data-k");r[k]=k==="price"?(parseFloat(el.value)||0):el.value;});});
      d.querySelectorAll("[data-rm]").forEach(function(b){b.addEventListener("click",function(){edit.rows.splice(+b.getAttribute("data-rm"),1);draw();});});
      q("#addR").addEventListener("click",function(){edit.rows.push({name:"",note:"",cat:"other",price:0,ref:null});draw();});
      q("#readShot").addEventListener("click",function(){
        var files=q("#eShot").files; if(!files||!files.length){msg("Choose one or more screenshots of the kit table first.",true);return;}
        var btn=q("#readShot"); btn.disabled=true; msg("Reading "+files.length+" screenshot"+(files.length>1?"s":"")+"…");
        window.claude.use("sample").then(function(sample){
          if(!sample) throw {code:"not_granted"};
          var prompt="These are screenshots of a paint protection film pre-cut kit table for one vehicle. Columns are Image, Part Number, Description, Difficulty, Price. "+
            "Return ONLY JSON: an array of objects {\"name\":string,\"note\":string,\"price\":number}, one per table row, in order. "+
            "name = the first line of Description. note = any further Description lines joined with ', ' (empty string if none). price = the USD price as a number with cents. "+
            "Skip any row whose price is 0. Do not include part numbers or difficulty. If a row appears in two screenshots, include it once.";
          return sample.json(prompt,{images:Array.prototype.slice.call(files,0,10),modelTier:"default"});
        }).then(function(arr){
          if(!Array.isArray(arr)||!arr.length) throw {code:"empty"};
          var r=LIB.shop.roundTo||50, rows=arr.filter(function(x){return x&&x.name&&+x.price>0;}).map(function(x){
            var nm=String(x.name).trim(), nt=String(x.note||"").trim(), cat=guessCat(nm,nt);
            return cat==="skip"?null:{name:nm,note:nt,cat:cat,ref:+x.price,price:Math.ceil(+x.price/r)*r};}).filter(Boolean);
          edit.rows=edit.rows.concat(rows); draw(); msg("Added "+rows.length+" pieces from the screenshots. Check every price against XPEL before saving.");
        }).catch(function(e){
          btn.disabled=false; var c=e&&e.code;
          msg(c==="not_granted"?"Reading screenshots needs permission to ask Claude. Allow it when prompted, or check the page's Permissions menu.":
              c==="rate_limited"?"Too many reads in a short time. Wait a minute and try again.":
              c==="empty"?"Couldn't find a kit table in those screenshots. Make sure the descriptions and prices are visible.":
              "Couldn't read the screenshots ("+(c||"error")+"). Try again, or use fewer images.",true);
        });
      });
      q("#readK").addEventListener("click",function(){var rows=parseKits(q("#ePaste").value,LIB.shop.roundTo||50);
        if(!rows.length){msg("No prices found in that text. Copy the whole kit table, including the prices, and paste again.",true);return;}
        edit.rows=edit.rows.concat(rows);draw();msg("Added "+rows.length+" pieces. Check the groups and prices, then save.");});
      q("#cancelV").addEventListener("click",function(){edit=null;draw();});
      q("#saveV").addEventListener("click",function(){
        if(!edit.year||!edit.make||!edit.model){msg("Add the year, make and model before saving.",true);return;}
        var rows=edit.rows.filter(function(r){return r.name.trim()&&r.price>0;});
        if(!rows.length){msg("Add at least one piece with a price.",true);return;}
        var nl=JSON.parse(JSON.stringify(LIB)); var id=edit.id||slug([edit.year,edit.make,edit.model,edit.trim].join(" "));
        var vObj={id:id,year:edit.year.trim(),make:edit.make.trim(),model:edit.model.trim(),trim:edit.trim.trim(),body:edit.body,drawing:drawFor(edit),
          pieces:rows.map(function(r,i){return {id:"p"+(i+1),name:r.name.trim(),note:r.note.trim(),cat:r.cat,price:Math.round(r.price)};})};
        nl.vehicles=nl.vehicles.filter(function(x){return x.id!==id&&x.id!==edit.id;}); nl.vehicles.push(vObj);
        try{sessionStorage.setItem("ppf_vid",id);}catch(e){}
        publishLib(nl,msg(""));
      });
    }
  }
  draw();
}

/* ---------- boot ---------- */
var SHARE_URL="https://claude.ai/artifact/U4VU1Er3rDq1Nj3jYeQdXf";
function hashId(){ var h=(location.hash||"").slice(1); return LIB.vehicles.some(function(x){return x.id===h;})?h:null; }
window.addEventListener("hashchange",function(){ var h=hashId(); if(h&&h!==state.vid) setVehicle(h); });
var saved=hashId(); if(!saved){ try{saved=sessionStorage.getItem("ppf_vid");}catch(e){} }
if(saved&&LIB.vehicles.some(function(x){return x.id===saved;})) setVehicle(saved);
else if(LIB.vehicles.length===1) setVehicle(LIB.vehicles[0].id);
else render();
if(window.claude&&window.claude.use){
  Promise.all([window.claude.use("artifact"),window.claude.use("user")]).then(function(r){
    state.art=r[0]; var u=r[1];
    if(state.art&&u&&u.canEdit){ u.canEdit().then(function(ok){ if(ok){state.canEdit=true;render();} }); }
  });
}
})();
</script>
