*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.5;font-weight:500}
[hidden]{display:none!important}
.bar{background:#fff;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:960px;margin:0 auto;height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:block;width:118px;height:46px;background:var(--logo) left center/contain no-repeat}
.who{font-size:13px;font-weight:600;color:#0B0B0C;display:flex;gap:12px;align-items:center;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who a{color:#0B0B0C}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 60px}
.brand{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,42px);line-height:1.05;margin:6px 0 4px;color:var(--ink);text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;color:var(--ink)}
p.lede{margin:0 0 18px;max-width:60ch}
label.f{display:flex;flex-direction:column;gap:6px;font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;letter-spacing:normal;text-transform:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:10px 12px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.find{display:grid;gap:10px}
.sel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.sel{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;border-radius:2px;padding:11px 16px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.count{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;padding:14px 0 6px}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list b{color:var(--ink)}
.list .meta{color:var(--muted);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.msg{margin-top:12px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.msg.ok{border-color:rgba(124,218,36,.5)}.msg.err{border-color:var(--warn)}
.msg input{margin-top:8px}
.req{margin-top:28px;padding-top:22px;border-top:1px solid var(--line);display:grid;gap:12px}
.req .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.req .row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hint{color:var(--muted);font-size:14px;margin:0}
</style>

<main class="wrap">
 <div class="brand">PPF Builder &middot; Staff</div>
 <h1>Find a car</h1>
 <p class="lede">Search the library, then copy the link and text it to your customer. If a car isn't here, request it below.</p>
 <div class="find">
  <label class="f" for="q">Search<input id="q" type="search" autocomplete="off" placeholder="Year, make, model or trim, e.g. 911 or Raptor"></label>
  <div class="sel">
   <label class="f" for="f_year">Year<select id="f_year" data-f="year"></select></label>
   <label class="f" for="f_make">Make<select id="f_make" data-f="make"></select></label>
   <label class="f" for="f_model">Model<select id="f_model" data-f="model"></select></label>

  <h2>Request a car</h2>
  <p class="hint">Not in the library? Send it to Chris and he'll add it. Your name goes with the request.</p>
  <div class="row">
   <label class="f" for="rY">Year<input id="rY" inputmode="numeric" maxlength="4" placeholder="e.g. 2026" required></label>
   <label class="f" for="rM">Make<input id="rM" maxlength="60" placeholder="e.g. Porsche" required></label>
   <label class="f" for="rO">Model<input id="rO" maxlength="60" placeholder="e.g. 911" required></label>
   <label class="f" for="rT">Trim<input id="rT" maxlength="80" placeholder="e.g. Carrera T"></label>

  <label class="f" for="rN">Note (optional)<textarea id="rN" rows="2" maxlength="1000" placeholder="e.g. Customer coming in Thursday, wants full front"></textarea></label>
  <div class="acts"><button class="btn primary" type="submit" id="rSend">Send request</button></div>
  <div id="rmsg" class="msg" hidden></div>
 </form>
</main>

   (filtering()?'<button class="btn" id="clr" type="button">Clear search</button>':(F.all?'<button class="btn" id="hide" type="button">Hide list</button>':'<button class="btn" id="all" type="button">Show all</button>'))+'</div>';
  if(show) h+=hits.length?'<div class="list">'+hits.map(function(v){return '<div><span><b>'+esc(name(v))+'</b> <span class="meta">&middot; '+esc(v.body)+'</span></span><span class="acts">'+
    '<button class="btn primary" type="button" data-copy="'+esc(v.id)+'">Copy customer link</button><a class="btn" target="_blank" rel="noopener" href="'+SITE+'#'+esc(v.id)+'">Open</a></span></div>';}).join("")+'</div>'
    :'<p class="hint">No cars match. Try fewer words, or <a href="#req" style="color:var(--accent)">request it</a>.</p>';
  $("#res").innerHTML=h;
  if($("#clr"))$("#clr").onclick=function(){F={q:"",year:"",make:"",model:"",trim:"",all:false};$("#q").value="";render();$("#q").focus();};
  if($("#all"))$("#all").onclick=function(){F.all=true;render();};
  if($("#hide"))$("#hide").onclick=function(){F.all=false;render();};
  document.querySelectorAll("[data-copy]").forEach(function(b){b.onclick=function(){copy(b.getAttribute("data-copy"));};});}
function note(el,t,cls){el.hidden=false;el.className="msg"+(cls?" "+cls:"");el.textContent=t;return el;}
function copy(id){var v=CARS.filter(function(c){return c.id===id;})[0], url=SITE+"#"+id, m=$("#cmsg");
  function show(t){note(m,t,"ok");var i=document.createElement("input");i.value=url;i.readOnly=true;m.appendChild(i);i.select();}
  try{navigator.clipboard.writeText(url).then(function(){show("Copied the link for "+name(v)+". Text it to your customer:");},function(){show("Copy this link for "+name(v)+":");});}
  catch(e){show("Copy this link for "+name(v)+":");}}
$("#q").addEventListener("input",function(e){F.q=e.target.value;render();});
document.querySelectorAll("[data-f]").forEach(function(s){s.addEventListener("change",function(){var k=s.getAttribute("data-f");F[k]=s.value;for(var j=K.indexOf(k)+1;j<K.length;j++)F[K[j]]="";render();});});
render();
fetch("/cdn-cgi/access/get-identity",{credentials:"same-origin"}).then(function(r){return r.ok?r.json():null;}).then(function(d){if(d&&(d.name||d.email))$("#who").textContent=d.name||d.email;}).catch(function(){});
$("#req").addEventListener("submit",function(e){e.preventDefault();
  var m=$("#rmsg"), y=$("#rY").value.trim(), mk=$("#rM").value.trim(), mo=$("#rO").value.trim(), tr=$("#rT").value.trim(), nt=$("#rN").value.trim();
  if(!/^(19|20)\d\d$/.test(y)||!mk||!mo){note(m,"Add the year, make and model.","err");return;}
  var dup=CARS.filter(function(v){return v.year===y&&v.make.toLowerCase()===mk.toLowerCase()&&v.model.toLowerCase()===mo.toLowerCase()&&(!tr||v.trim.toLowerCase()===tr.toLowerCase());})[0];
  if(dup){note(m,"That car is already in the library: "+name(dup)+". Search for it above.","err");return;}
  var b=$("#rSend"); b.disabled=true; note(m,"Sending…");
  fetch("/api/request",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({year:y,make:mk,model:mo,trim:tr,note:nt})})
   .then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {ok:r.ok,j:j};});})
   .then(function(x){b.disabled=false;
     if(x.ok){note(m,"Request sent for "+[y,mk,mo,tr].filter(Boolean).join(" ")+". Chris will add it to the library.","ok");["rY","rM","rO","rT","rN"].forEach(function(id){$("#"+id).value="";});}
     else note(m,x.j.error||"Couldn't send the request. Try again in a minute.","err");})
   .catch(function(){b.disabled=false;note(m,"Couldn't reach the server. Check your connection and try again.","err");});});
})();
</script>
</body></html>
